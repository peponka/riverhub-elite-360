services:
  - type: web
    name: viabarcazas
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AIS_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        value: https://viabarcazas.com
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: BACKEND_URL
        value: https://viabarcazas.com
