name: CI — ViaBarcazas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Check for secrets in code
        run: |
          echo "Checking for hardcoded secrets..."
          ! grep -rn "viabarcazas2026super" public/ --include="*.html" --include="*.js" || (echo "FAIL: Hardcoded password found!" && exit 1)
          ! grep -rn "x-api-key.*riverhub_n8n" public/ --include="*.js" || (echo "FAIL: Hardcoded API key found!" && exit 1)
          ! grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude=package-lock.json --exclude=ci.yml "RH_Secure_n8n_" . || (echo "FAIL: Historical n8n key found!" && exit 1)
          echo "✅ No hardcoded secrets found"

      - name: Verify app starts
        env:
          NODE_ENV: production
          PORT: 3000
        run: |
          node app.js > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          for attempt in {1..10}; do
            curl --fail --silent http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run web end-to-end tests
        run: npx playwright test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riverhub_mobile/riverhub_mobile_v2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze mobile app
        run: flutter analyze

      - name: Run mobile tests
        run: flutter test
