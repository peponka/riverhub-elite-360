<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recuperar Contraseña - RiverHub Elite 360</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1281e2",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101a22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex flex-col">
<!-- Header / Navbar -->
<header class="w-full border-b border-gray-200 dark:border-[#233748] bg-white dark:bg-[#111a22] z-10">
<div class="px-6 lg:px-10 py-3 flex items-center justify-between">
<div class="flex items-center gap-3 text-slate-900 dark:text-white">
<div class="size-6 text-primary">
<span class="material-symbols-outlined text-2xl">anchor</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">RiverHub Elite 360</h2>
</div>
<a class="flex items-center justify-center rounded-lg h-9 px-4 border border-gray-200 dark:border-[#324e67] hover:bg-gray-50 dark:hover:bg-[#192733] transition-colors text-sm font-semibold" href="#">
<span class="truncate">Iniciar sesión</span>
</a>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-4 relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 opacity-20 dark:opacity-10 pointer-events-none overflow-hidden">
<div class="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-primary blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[400px] h-[400px] rounded-full bg-primary blur-[100px]"></div>
</div>
<!-- Card Container -->
<div class="relative z-10 w-full max-w-[480px] bg-white dark:bg-[#111a22] border border-gray-200 dark:border-[#233748] rounded-xl shadow-2xl overflow-hidden">
<!-- Card Header -->
<div class="p-8 pb-4">
<div class="flex justify-center mb-6">
<div class="size-16 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl">lock_reset</span>
</div>
</div>
<h1 class="text-2xl md:text-[32px] font-bold leading-tight text-center text-slate-900 dark:text-white mb-2">
                    Recuperar Contraseña
                </h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal text-center">
                    Ingrese la dirección de correo electrónico asociada a su cuenta y le enviaremos un enlace para restablecer su contraseña.
                </p>
</div>
<!-- Form Section -->
<div class="px-8 py-4">
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Correo Electrónico</span>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="form-input flex w-full rounded-lg border border-slate-300 dark:border-[#324e67] bg-white dark:bg-[#192733] focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-11 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#92afc9] text-base transition-colors" placeholder="usuario@empresa.com" required="" type="email"/>
</div>
</label>
<!-- Submit Button -->
<button class="group relative flex w-full items-center justify-center overflow-hidden rounded-lg bg-primary h-12 px-5 text-white text-base font-bold leading-normal transition-all hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-[#111a22]" type="submit">
<span class="truncate relative z-10 flex items-center gap-2">
                            Enviar enlace de recuperación
                            <span class="material-symbols-outlined text-sm transition-transform group-hover:translate-x-1">arrow_forward</span>
</span>
</button>
</form>
</div>
<!-- Card Footer -->
<div class="px-8 py-6 bg-slate-50 dark:bg-[#0d141c] border-t border-gray-100 dark:border-[#233748] flex justify-center">
<a class="flex items-center gap-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Volver al inicio de sesión
                </a>
</div>
</div>
</main>
<!-- Footer info (Optional for industrial apps) -->
<footer class="w-full py-4 text-center text-xs text-slate-400 dark:text-slate-600 z-10">
        © 2024 RiverHub Elite 360. Todos los derechos reservados.
    </footer>
</body></html>
