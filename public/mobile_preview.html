<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaBarcazas Mobile Preview</title>
    <style>
        body {
            background-color: #0b1116;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            /* iPhone X dimensions */
            background-color: #000;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.2);
            border: 10px solid #1f2937;
            overflow: hidden;
            position: relative;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background-color: #1f2937;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #fff;
        }

        .info {
            margin-bottom: 20px;
            text-align: center;
        }

        .info h1 {
            margin: 0;
            color: #00e5ff;
        }

        .info p {
            color: #889;
        }
    </style>
</head>

<body>
    <div class="info">
        <h1>VISTA MÓVIL</h1>
        <p>Simulador de dispositivo móvil (iPhone X)</p>
    </div>
    <div class="phone-frame">
        <div class="phone-notch"></div>
        <iframe src="app.html?mode=login"></iframe>
    </div>
</body>

</html>
