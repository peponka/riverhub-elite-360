<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña — FluviaFleet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#F8F9FA;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
        .card{background:white;border-radius:20px;padding:48px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.08);border:1px solid #E2E8F0}
        .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center}
        .logo img{height:32px}
        .logo span{font-size:18px;font-weight:700;color:#1A1A2E}
        h1{font-size:22px;font-weight:700;color:#1A1A2E;margin-bottom:8px;text-align:center}
        p{font-size:14px;color:#94A3B8;text-align:center;margin-bottom:32px;line-height:1.6}
        label{display:block;font-size:12px;font-weight:600;color:#64748B;margin-bottom:6px;letter-spacing:0.3px}
        input{width:100%;padding:12px 16px;border:1px solid #E2E8F0;border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;color:#1A1A2E;outline:none;transition:border-color .2s;margin-bottom:16px}
        input:focus{border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
        .btn{width:100%;padding:14px;background:#1A1A2E;color:white;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s;margin-top:8px}
        .btn:hover{opacity:.85}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .msg{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-top:16px;display:none;text-align:center}
        .msg.success{background:#DCFCE7;color:#166534;display:block}
        .msg.error{background:#FEE2E2;color:#991B1B;display:block}
        .back{display:block;text-align:center;margin-top:24px;font-size:13px;color:#94A3B8;text-decoration:none}
        .back:hover{color:#1A1A2E}
        .strength{height:4px;border-radius:2px;margin-top:-10px;margin-bottom:16px;background:#E2E8F0;overflow:hidden}
        .strength-bar{height:100%;width:0%;transition:width .3s,background .3s;border-radius:2px}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <img src="/img/fluvia-wordmark.png" alt="FluviaFleet" onerror="this.style.display='none'">
        <span>FluviaFleet</span>
    </div>
    <h1>Nueva contraseña</h1>
    <p>Ingresá tu nueva contraseña.<br>Mínimo 8 caracteres.</p>

    <div id="form-section">
        <label>Nueva contraseña</label>
        <input type="password" id="password" placeholder="••••••••" oninput="checkStrength(this.value)">
        <div class="strength"><div class="strength-bar" id="strength-bar"></div></div>

        <label>Confirmar contraseña</label>
        <input type="password" id="confirm" placeholder="••••••••">

        <button class="btn" id="btn-save" onclick="savePassword()">Guardar contraseña</button>
    </div>

    <div class="msg" id="msg"></div>
    <a href="/" class="back">← Volver al inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://nfybnnpdrvyxucgpqmmo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5meWJubnBkcnZ5eHVjZ3BxbW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzY4NzQxNzksImV4cCI6MjA1MjQ1MDE3OX0.q4FWpB0ox9IqRTSfLIJK3tSS2Ey3W3TBJHMHvQlq5kY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
}

function checkStrength(val) {
    const bar = document.getElementById('strength-bar');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const colors = ['#EF4444','#F97316','#EAB308','#22C55E'];
    const widths = ['25%','50%','75%','100%'];
    bar.style.width = score ? widths[score-1] : '0%';
    bar.style.background = score ? colors[score-1] : '';
}

async function savePassword() {
    const pass = document.getElementById('password').value;
    const conf = document.getElementById('confirm').value;
    const btn  = document.getElementById('btn-save');

    if (pass.length < 8) return showMsg('La contraseña debe tener al menos 8 caracteres.', 'error');
    if (pass !== conf)   return showMsg('Las contraseñas no coinciden.', 'error');

    btn.disabled = true;
    btn.textContent = 'Guardando...';

    // Si la sesión aún no está lista, esperar hasta 3 segundos
    if (!sessionReady) {
        await new Promise(resolve => setTimeout(resolve, 1500));
    }

    const { error } = await sb.auth.updateUser({ password: pass });

    if (error) {
        showMsg('Error: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Guardar contraseña';
    } else {
        document.getElementById('form-section').style.display = 'none';
        showMsg('✅ Contraseña actualizada. Redirigiendo...', 'success');
        setTimeout(() => window.location.href = '/fluvia.html', 2000);
    }
}

// Usar onAuthStateChange para detectar el evento PASSWORD_RECOVERY
let sessionReady = false;

sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
        sessionReady = true;
        // Sesión lista, el formulario ya está visible
    }
});

window.addEventListener('load', async () => {
    const hash = window.location.hash;
    if (!hash.includes('access_token')) {
        showMsg('Link inválido o expirado. Pedí un nuevo link desde la app.', 'error');
        document.getElementById('form-section').style.display = 'none';
        return;
    }

    // Extraer tokens y establecer sesión manualmente como fallback
    const params = new URLSearchParams(hash.replace('#', ''));
    const accessToken  = params.get('access_token');
    const refreshToken = params.get('refresh_token');

    if (accessToken) {
        try {
            if (refreshToken) {
                await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
            } else {
                // Solo access_token — intentar igual
                await sb.auth.setSession({ access_token: accessToken, refresh_token: accessToken });
            }
            sessionReady = true;
        } catch(e) {
            console.warn('setSession error:', e);
        }
    }
});
</script>
</body>
</html>
