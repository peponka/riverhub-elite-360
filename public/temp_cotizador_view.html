<div id="view-cotizador" class="view-section" style="display:none;">
    <div class="cotizador-container">
        <!-- Header -->
        <div class="cotizador-header">
            <div class="header-title">
                <h2>COTIZADOR IA</h2>
                <span>MOTOR GEMINI ULTRA-1.0</span>
            </div>
            <div class="mode-toggle">
                <button class="btn-mode active">IA</button>
                <button class="btn-mode">MANUAL</button>
            </div>
        </div>

        <div class="cotizador-content">
            <!-- Left Panel -->
            <div class="params-card">
                <span class="section-label">PARÁMETROS DE MERCADO</span>

                <div class="input-row">
                    <div class="input-group">
                        <label>ORIGEN</label>
                        <input type="text" id="cot-origin" class="input-dark" value="Asunción (PY)">
                    </div>
                    <div class="input-group">
                        <label>DESTINO</label>
                        <input type="text" id="cot-dest" class="input-dark" value="Rosario (ARG)">
                    </div>
                </div>

                <div class="input-group">
                    <label>VOLUMEN (TONELADAS)</label>
                    <input type="number" id="cot-quantity" class="input-dark" value="15000">
                </div>

                <div class="slider-container">
                    <div class="range-info">
                        <label>NIVEL DE RÍO (SIMULADO)</label>
                        <span id="rio-value" class="range-val">3.45M</span>
                    </div>
                    <input type="range" id="rio-slider" min="0" max="10" step="0.1" value="3.45">
                    <div
                        style="display:flex; justify-content:space-between; font-size:10px; color:#445; margin-top:5px;">
                        <span>NIVEL CRÍTICO</span>
                        <span>NIVEL ÓPTIMO</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>PRECIO BÚNKER REFERENCIAL (USD/L)</label>
                    <input type="number" id="cot-bunker" class="input-dark" value="1,12">
                </div>

                <button id="btn-cotizar" class="btn-calc-big">
                    <i class="fas fa-magic"></i> CALCULAR CON IA
                </button>
            </div>

            <!-- Right Panel -->
            <div class="results-card">
                <div class="price-area">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span class="price-label">PRECIO FINAL ESTIMADO</span><br>
                        </div>
                        <span style="font-size:10px; color:#64748b;">TARIFA X TONELADA</span>
                    </div>
                    <div class="big-price" id="final-price">USD --.--</div>
                </div>

                <div class="stats-row">
                    <div class="stat-box">
                        <i class="fas fa-clock stat-icon"></i>
                        <span class="stat-title">TRÁNSITO EST.</span>
                        <span class="stat-value" id="stat-dias">0 Días</span>
                    </div>
                    <div class="stat-box">
                        <i class="fas fa-shield-alt stat-icon"></i>
                        <span class="stat-title">CONFIANZA IA</span>
                        <span class="stat-value" id="stat-confianza">0%</span>
                    </div>
                    <div class="stat-box">
                        <i class="fas fa-chart-line stat-icon"></i>
                        <span class="stat-title">VS. MERCADO</span>
                        <span class="stat-value">---</span>
                    </div>
                </div>

                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <i class="checkbox-box"></i> <span class="section-label">ARGUMENTACIÓN COMERCIAL</span>
                    <span style="margin-left:auto; font-size:10px; color:#445;"><i class="fas fa-lock"></i> BLOQUEAR
                        PRECIO</span>
                </div>
                <div class="ai-reasoning" id="ai-text">
                    Esperando ingreso de parámetros para procesar oferta...
                </div>

                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn-mode" style="flex:1; border:1px solid #334; color:#fff; padding:12px;">
                        <i class="fas fa-file-pdf"></i> DESCARGAR PDF FORMAL
                    </button>
                    <button class="btn-mode" style="flex:1; background:#10b981; color:#000; padding:12px;">
                        <i class="fas fa-paper-plane"></i> ENVIAR PROPUESTA A CLIENTE
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
