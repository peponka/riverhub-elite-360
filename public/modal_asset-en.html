<div id="modal-add-asset" class="modal-overlay"
    style="display:none; align-items:center; justify-content:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; backdrop-filter:blur(5px);">
    <div
        style="background:#0f151f; border:1px solid #1e293b; border-radius:16px; padding:30px; width:500px; max-width:90%; font-family: 'Rajdhani', sans-serif;">
        <h2 style="color:#fff; margin-top:0; border-bottom:1px solid #334155; padding-bottom:15px; margin-bottom:20px;">
            NUEVO ACTIVO</h2>
        <div style="display:grid; gap:15px;">
            <input type="text" placeholder="Nombre del Buque"
                style="background:#060b10; border:1px solid #334155; padding:10px; color:#fff; border-radius:8px;">
            <input type="text" placeholder="Matrícula"
                style="background:#060b10; border:1px solid #334155; padding:10px; color:#fff; border-radius:8px;">
            <select style="background:#060b10; border:1px solid #334155; padding:10px; color:#fff; border-radius:8px;">
                <option>Tugboat de Empuje</option>
                <option>Barge Tanque</option>
                <option>Barge Granelera</option>
            </select>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:25px;">
            <button onclick="document.getElementById('modal-add-asset').style.display='none'"
                style="background:transparent; border:1px solid #334155; color:#cbd5e1; padding:8px 16px; border-radius:8px; cursor:pointer;">CANCELAR</button>
            <button
                style="background:#00E5FF; border:none; color:#000; font-weight:bold; padding:8px 16px; border-radius:8px; cursor:pointer;">GUARDAR</button>
        </div>
    </div>
</div>
